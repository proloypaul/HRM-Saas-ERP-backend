spring:  
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:hrm_saas_db}
    username: ${POSTGRES_USER:hrm_admin}
    password: ${POSTGRES_PASSWORD:hrm_secret_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      # ddl-auto: validate
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: false
    # baseline-on-migrate: true
    # baseline-version: 0
    # locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms

# Application Security, Multi-Tenancy, Cache & JWT
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:15m}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:7d}
    issuer: hrm-saas
  security:
    cookie:
      name: ${COOKIE_NAME:hrm_refresh_token}
      access-cookie-name: ${ACCESS_COOKIE_NAME:hrm_access_token}
      http-only: ${COOKIE_HTTP_ONLY:true}
      secure: ${COOKIE_SECURE:false}
      same-site: ${COOKIE_SAME_SITE:Lax}
      domain: ${COOKIE_DOMAIN:}
      path: ${COOKIE_PATH:/api/v1}
      refresh-path: ${COOKIE_REFRESH_PATH:/api/v1/auth}
      max-age: ${COOKIE_MAX_AGE:7d}
  cache:
    redis:
      enabled: ${REDIS_CACHE_ENABLED:true}
      default-ttl: ${REDIS_DEFAULT_TTL:30m}
      domain-ttl: ${REDIS_DOMAIN_TTL:15m}
      key-prefix: hrm
  tenancy:
    mode: ${TENANCY_MODE:LOCAL}
    base-domain: ${BASE_DOMAIN:localhost}
    allow-localhost-subdomains: ${ALLOW_LOCALHOST_SUBDOMAINS:true}
    platform-subdomain: ${PLATFORM_SUBDOMAIN:platform}

# Actuator & Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Springdoc OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    root: INFO
    com.hrm.saas: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
