server:
  port: ${SERVER_PORT:9080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: hrm-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# Base security defaults configurable by environment variables
app:
  security:
    cookie:
      name: ${COOKIE_NAME:hrm_refresh_token}
      http-only: ${COOKIE_HTTP_ONLY:true}
      secure: ${COOKIE_SECURE:false}
      same-site: ${COOKIE_SAME_SITE:Lax}
      domain: ${COOKIE_DOMAIN:}
      path: ${COOKIE_PATH:/api/v1/auth}
      max-age: ${COOKIE_MAX_AGE:7d}

